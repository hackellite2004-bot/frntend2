<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
        {% block title %}Network Monitor Dashboard{% endblock %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Global Premium CSS -->
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">

    <style>
        .topbar-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 1.5rem 0;
            max-width: 1500px;
            margin: 0 auto;
        }

        .topbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            box-shadow: 0 10px 30px -10px rgba(11,54,101,0.08);
            margin-bottom: 1rem;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--blue);
            text-decoration: none;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dim) 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px var(--blue-glow);
        }
        
        .brand-icon svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

        .brand:hover { color: var(--blue-dim); }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-links a {
            font-family: var(--font-display);
            color: var(--ink-2);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: var(--r-md);
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .nav-links a:hover {
            background: var(--surface-3);
            color: var(--ink);
        }

        .nav-links a.active {
            background: var(--surface-2);
            color: var(--blue);
            border-color: var(--border);
            box-shadow: 0 2px 8px rgba(11,54,101,0.05);
        }

        .danger-link {
            background: var(--red-light);
            color: var(--red) !important;
            border: 1px solid var(--red-glow);
            border-radius: var(--r-md);
            padding: 8px 14px;
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .danger-link:hover {
            background: var(--red);
            color: white !important;
            box-shadow: 0 4px 12px var(--red-glow);
        }

        @media (max-width: 768px) {
            .topbar { flex-direction: column; gap: 1rem; padding: 1rem; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="topbar-wrapper">
    <nav class="topbar">
        <a class="brand" href="{% url 'dashboard:index' %}">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            Network Monitor
        </a>

        <div class="nav-links">
            <a href="{% url 'dashboard:index' %}" class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">Overview</a>
            <a href="{% url 'devices:devices' %}" class="{% if request.resolver_match.namespace == 'devices' %}active{% endif %}">Devices</a>
            <a href="{% url 'alerts:alerts' %}" class="{% if request.resolver_match.namespace == 'alerts' %}active{% endif %}">Alerts</a>
            <a href="{% url 'scans:scans' %}" class="{% if request.resolver_match.namespace == 'scans' %}active{% endif %}">Scans</a>

            {% if request.resolver_match.url_name != 'setup' %}
            <form action="{% url 'dashboard:reset_monitoring' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="danger-link" onclick="return confirm('Reset all monitoring data and configuration?');">Reset</button>
            </form>
            {% endif %}
        </div>
    </nav>
</div>

<main>
    {% if messages %}
    <div class="mb-4">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-shell" style="padding: 1rem; border-radius: var(--r-md); border-left: 4px solid var(--blue);">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
