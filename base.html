<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
        {% block title %}
            Network Monitor Dashboard
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background: #f6f7fb;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
            margin: 0;
        }

        .topbar {
            background: #111827;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .topbar-inner {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .brand {
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.06em;
        }

        .brand:hover {
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            transition: 0.2s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .nav-links a.active {
            background: rgba(255,255,255,0.12);
            color: white;
        }

        .danger-link {
            background: rgba(220,38,38,0.15);
            color: #fecaca !important;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .danger-link:hover {
            background: rgba(220,38,38,0.3);
            color: white !important;
        }

        main {
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 768px) {

            .topbar-inner {
                flex-direction: column;
                gap: 10px;
                padding: 12px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

    </style>

</head>

<body>

<nav class="topbar">

    <div class="topbar-inner">

        <a class="brand" href="{% url 'dashboard:index' %}">
            NETWORK MONITOR
        </a>

        <div class="nav-links">

            <a href="{% url 'dashboard:index' %}"
               class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                Overview
            </a>

            <a href="{% url 'devices:devices' %}"
               class="{% if request.resolver_match.namespace == 'devices' %}active{% endif %}">
                Devices
            </a>

            <a href="{% url 'alerts:alerts' %}"
               class="{% if request.resolver_match.namespace == 'alerts' %}active{% endif %}">
                Alerts
            </a>

            <a href="{% url 'scans:scans' %}"
               class="{% if request.resolver_match.namespace == 'scans' %}active{% endif %}">
                Scans
            </a>

            {% if request.resolver_match.url_name != 'setup' %}

            <form action="{% url 'dashboard:reset_monitoring' %}" method="post" style="display:inline;">
                {% csrf_token %}

                <button type="submit"
                        class="danger-link"
                        onclick="return confirm('Reset all monitoring data and configuration?');">
                    Reset
                </button>
            </form>

            {% endif %}

        </div>

    </div>

</nav>

<main>

    <div class="page-container">

        {% block content %}
        {% endblock %}

    </div>


    {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}



</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
